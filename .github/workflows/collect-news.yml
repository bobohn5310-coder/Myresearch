name: 국내 연구소식 자동 수집

# 매일 공개 RSS 에서 국내 연구 소식을 모아 data/news.json 으로 커밋한다.
# Supabase 는 DB 안의 예약 작업(pg_cron)이 이 파일을 읽어 news 테이블에 반영하므로
# GitHub 에 Supabase 키를 등록할 필요가 없다. (supabase/news_collector.sql 참고)

on:
  schedule:
    - cron: "10 18 * * *"   # 매일 한국시간 새벽 3시 10분 (DB 반영은 3시 40분)
  workflow_dispatch:
  push:
    paths:
      - scripts/collect_news.py
      - .github/workflows/collect-news.yml

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 연구소식 수집
        run: python scripts/collect_news.py --out data/news.json
      - name: 결과 미리보기
        run: |
          python - <<'PY'
          import json, collections
          rows = json.load(open("data/news.json", encoding="utf-8"))
          print("총", len(rows), "건")
          print("분야별", dict(collections.Counter(r["field"] for r in rows)))
          print("출처별", dict(collections.Counter(r["org"] for r in rows).most_common(15)))
          for r in rows[:25]:
              print(r["date"], r["field"], r["tag"], "|", r["org"], "|", r["title"])
          PY
      - name: 바뀐 내용이 있으면 커밋 (main 에서만)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "국내 연구소식 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
