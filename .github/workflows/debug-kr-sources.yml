name: 국내 학회 출처 조사 (임시)
on:
  push:
    branches: [claude/project-thread-m4j4e5]
    paths: [.github/workflows/debug-kr-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.nl.go.kr/rink/contents/R11101000000.do"
          curl -sS -A "Mozilla/5.0" -c c.txt "$U" -o p.html
          echo "=== script 330-420"; sed -n 330,420p p.html
          echo "=== form 530-595"; sed -n 530,595p p.html | grep -v '^\s*$'
          echo "=== paging 730-760"; sed -n 730,760p p.html
          for q in "pageIndex=2" "pageIndex=2&recordCountPerPage=100" "pageIndex=1&pageUnit=100"; do
            curl -sS -A "Mozilla/5.0" -b c.txt -X POST --data "$q" "$U" -o q.html
            echo "=== POST $q rows=$(grep -c "fn_goView('" q.html) first=$(grep -o "fn_goView('[0-9]*')" q.html | head -2 | tr '\n' ' ')"
          done
