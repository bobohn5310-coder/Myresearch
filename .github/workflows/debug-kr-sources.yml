name: 국내 학회 출처 조사 (임시)
on:
  push:
    branches: [claude/project-thread-m4j4e5]
    paths: [.github/workflows/debug-kr-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://www.nl.go.kr/rink/contents/R11101000000.do"
          for p in 1 2 3 4; do
            curl -sS -A "Mozilla/5.0" "$U?page=$p&pageSize=100&ordFld=regdtASC&ordBy=asc" -o l$p.html
            echo "page $p rows=$(grep -c "fn_goView('" l$p.html)"
          done
          echo "=== categories"; cat l*.html | grep -o 'class="title" title="[0-9]*">[^<]*' | sed 's/.*title="//' | sort | uniq -c | sort -rn
          echo "=== korean-looking titles"; cat l*.html | grep -A1 "fn_goView('" | grep -v fn_goView | grep -E '[가-힣]' | sed 's/^\s*//' | head -60
          ID=$(grep -o "fn_goView('[0-9]*')" l1.html | grep -o '[0-9]\+' | sed -n 8p)
          curl -sS -A "Mozilla/5.0" "$U?schM=view&recKey=$ID" -o d.html
          echo "=== detail $ID"; sed -e 's/<[^>]*>/ /g' d.html | tr -s ' \t' ' ' | grep -v '^\s*$' | grep -n -i -A40 '주최\|홈페이지\|기간' | head -80
          echo "=== detail links"; grep -o 'href="http[^"]*"' d.html | grep -v nl.go.kr | head
