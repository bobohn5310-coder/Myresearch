name: 학회 정보 자동 수집

# 매일 공개 소스에서 학회를 모아 data/conferences.json 으로 커밋한다.
# Supabase 는 DB 안의 예약 작업(pg_cron)이 이 파일을 읽어 academic_info 에 반영하므로
# GitHub 에 Supabase 키를 등록할 필요가 없다. (supabase/academic_info_collector.sql 참고)

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 한국시간 새벽 3시 (DB 반영은 3시 30분)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-conferences
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: 학회 수집
        run: python scripts/collect_conferences.py --dry-run --out data/conferences.json
      - name: 바뀐 내용이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "학회 정보 자동 갱신 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main   # 수집 중에 main이 바뀌었어도 저장되게
            git push
          fi
